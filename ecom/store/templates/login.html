{% extends "base.html" %}
{% block  content %}
 <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Login Account...</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Welcome To Ecommerce</p>
                </div>
            </div>
        </header>
        <div class="container">
            <div class="row">
                <center>
                    <div class ="col-8"><br><br>
                        <div class="container d-flex justify-content-center align-items-center" >
  <form style="width:300px;" method = 'POST' action="{% url 'login' %}">
    {% csrf_token %}
    <div class="mb-3">
      <input type="text" class="form-control" name="username" placeholder="Enter Username">
    </div><br>

    <div class="mb-3">
      <input type="password" class="form-control" name="password" placeholder="Enter Password">
    </div><br><br>

    <button type="submit" class="btn btn-secondary w-100">Login</button><br><br>

  </form>
</div><br><br>
                        </div>
                </center>
            </div>
        </div>
        <br><br>
        <br><br>
        <br><br>
        

{% endblock  %}
