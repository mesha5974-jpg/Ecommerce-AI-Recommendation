{% extends "base.html" %}
{% block  content %}
        <br>
        <div class="container">
            <div class="row">
                <center>
                    <div class ="col-8"><br>
                        <div class="card mb-3">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{product.image.url}}" class="img-fluid rounded-start" alt="...">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">{{product.name}}</h5>
        <p class="card-text">{{product.description}}</p>
        {% if product.is_sale %}
        &nbsp;&nbsp;Sale&nbsp;&nbsp;
        <strike>
        ${{product.price}}
        </strike>
        &nbsp;
        ${{product.sale_price}}
        {% else %}
        <div class="text-center">
       <!-- Product price-->
        ${{product.price}}
      </div>
        {% endif %}
        <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
      <a href="{% url 'home' %}" class="btn btn-secondary">Back</a>
    </div>
    </div>
  </div>
</div>
                        </div>
                </center>
            </div>
        </div>
        <br><br>
        <br><br>
        <br><br>
        
        

{% endblock  %}
